framework:
    rate_limiter:
        # Registration attempts (API and web sign-up), keyed by client IP. Every attempt counts,
        # failed ones included: it also slows down probing which emails already have an account.
        registration:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # Attempts to join a game with an invite code (POST /api/games/join), keyed by user. Every attempt counts:
        # codes cannot be guessed (~10^12 combinations) but probing stays slow and visible.
        game_join:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
